[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "sims4-stark-framework"
version = "0.1.0"
description = "A modern, typed modding framework for The Sims 4"
readme = "README.md"
license = "MIT"
requires-python = ">=3.7"
authors = [
    { name = "Stark Labs", email = "studio@starklabs.dev" },
]
keywords = ["sims4", "modding", "framework", "ts4"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Topic :: Games/Entertainment :: Simulation",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.urls]
Homepage = "https://github.com/stark-studio-labs/sims4-stark-framework"
Repository = "https://github.com/stark-studio-labs/sims4-stark-framework"
Issues = "https://github.com/stark-studio-labs/sims4-stark-framework/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
